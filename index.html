<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NewTube Web</title>
  <meta name="description" content="An ad-free, privacy-friendly way to watch YouTube in the browser.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
  <script src="config.js?v=5"></script>
  <script src="vendor/shaka-player.compiled.js" defer></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="NewTube home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b6cff"/><stop offset="1" stop-color="#1e2a78"/></linearGradient>
        </defs>
        <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#mk)"/>
        <rect x="1.5" y="1.5" width="29" height="14" rx="8.5" fill="#fff" opacity=".16"/>
        <path d="M13 10.5v11l9-5.5z" fill="#fff"/>
      </svg>
      <span class="brand-name">NewTube</span>
    </a>
    <form class="search glass" id="searchForm" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" name="q" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-label="Search videos">
    </form>
    <a class="avatar-btn glass" id="acctBtn" href="#/settings" aria-label="Account and settings"></a>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar glass" id="tabbar" aria-label="Main">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.8H9.2v5.8H5A1.5 1.5 0 0 1 3.5 19z"/></svg><span>Home</span></a>
    <a href="#/shorts" data-tab="shorts"><svg viewBox="0 0 24 24"><path d="M15.8 3.6a3.4 3.4 0 0 1 3 5.3l-1.3 1.9 1 .6a3.4 3.4 0 0 1-.4 6l-7.6 3.6a3.4 3.4 0 0 1-3.5-5.8l1.2-.9-1-.6a3.4 3.4 0 0 1 .4-6l7.6-3.6a3.4 3.4 0 0 1 .6-.2z"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></svg><span>Shorts</span></a>
    <a href="#/subs" data-tab="subs"><svg viewBox="0 0 24 24"><path d="M6 3.5h12M4.5 6.5h15"/><rect x="3" y="9.5" width="18" height="11" rx="2.5"/><path d="M10.5 12.5v5l4-2.5z"/></svg><span>Subscriptions</span></a>
    <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Library</span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9"/><circle cx="15" cy="7.5" r="2"/><circle cx="9" cy="16.5" r="2"/></svg><span>Settings</span></a>
  </nav>

  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
